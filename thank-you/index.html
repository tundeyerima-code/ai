<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You for Submitting!</title>
    
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            max-width: 500px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            text-align: center;
        }

        /* Success Checkmark Styling */
        .success-mark {
            width: 80px;
            height: 80px;
            background-color: #e6f7ed;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .success-mark svg {
            width: 40px;
            height: 40px;
            color: #24b47e;
        }

        h1 {
            color: #1a1a1a;
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p.subtitle {
            color: #666666;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        hr {
            border: 0;
            height: 1px;
            background: #eef2f5;
            margin-bottom: 32px;
        }

        /* WhatsApp Div Styling */
        .whatsapp-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .whatsapp-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.1);
        }

        .whatsapp-box p {
            color: #166534;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: background-color 0.2s;
            width: 100%;
        }

        .whatsapp-btn:hover {
            background-color: #20ba5a;
        }

        .whatsapp-btn svg {
            margin-right: 8px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="success-mark">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
        </div>

        <h1>Thank you for submitting your form!</h1>
        <p class="subtitle">We will contact you shortly with more details.</p>

        <hr>

        <div class="whatsapp-box">
            <p>Want to get a head start? Join our community to master the algorithm!</p>
            <a href="#" class="whatsapp-btn" target="_blank">

                Click here to join our WhatsApp channel to learn more YouTube Automation
            </a>
        </div>
    </div>

</body>
</html>
